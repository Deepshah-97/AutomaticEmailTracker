# Render Blueprint: the follow-up agent and the demo dashboard. The Postgres database lives on
# Supabase's free plan; paste its Session pooler connection string as DATABASE_URL.
# Deploy from the Render dashboard: New > Blueprint > pick this repository.
# Values marked "sync: false" are asked for once when the Blueprint is created.

services:
  - type: web
    name: followup-agent
    runtime: docker
    # Free plan for demos: sleeps after 15 idle minutes, and while asleep it does no hourly checks or
    # scheduled sends. Switch to a paid plan (e.g. 0.5c-512mb) before using it with real clients.
    plan: free
    region: oregon
    healthCheckPath: /v1/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # GOOGLE_ALLOWED_DOMAINS is left unset so personal Gmail accounts can connect.
      # OAUTH_REDIRECT_URI defaults to <this service's public URL>/oauth/google/callback.
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: SENDING_ENABLED
        value: "true"
      - key: TEST_MODE
        value: "true"
      # Comma-separated: the only addresses that can send or receive while TEST_MODE is on.
      - key: TEST_ALLOWLIST
        sync: false

  - type: web
    name: followup-dashboard
    repo: https://github.com/deepshah-97/demotracker
    branch: main
    runtime: python
    # Free plan: sleeps after 15 idle minutes and has no disk, so its local cache and logins reset on
    # restart. The agent holds all real data and retries webhooks while the dashboard wakes up.
    plan: free
    region: oregon
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-dev uvicorn --factory app.main:create_app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /login
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: UV_PYTHON_DOWNLOADS
        value: never
      - key: DATABASE_PATH
        value: ./dashboard.db
      # The agent's public URL, e.g. https://followup-agent.onrender.com
      - key: AGENT_BASE_URL
        sync: false
      # Both come from the "api-clients" admin call after the agent is up.
      - key: AGENT_API_KEY
        sync: false
      - key: AGENT_WEBHOOK_SECRET
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
