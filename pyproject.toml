[project]
name = "followup-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "apscheduler>=3.11.3",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "sentry-sdk>=2.73.0",
    "sqlalchemy>=2",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "openapi-spec-validator>=0.9.0",
    "pytest>=9.2.0",
    "pytest-timeout>=2.4.0",
    "pyyaml>=6.0.3",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
extend-ignore = ["B008"]  # FastAPI's Depends() in defaults is the intended pattern

[tool.ruff.lint.per-file-ignores]
"app/ai/prompt.py" = ["E501"]  # prompt text reads better unwrapped
"alembic/env.py" = ["E402"]
