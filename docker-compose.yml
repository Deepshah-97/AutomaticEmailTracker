services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: followup
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d followup"]
      interval: 2s
      retries: 20

  agent:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://agent:agent@db:5432/followup
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
